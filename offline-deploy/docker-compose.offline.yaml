# docker-compose.offline.yaml
# 内网离线部署用（不含 ollama）
# 用法:  docker compose -f docker-compose.offline.yaml up -d
# 前提: 已通过 docker load -i open-webui-offline*.tar.gz 导入镜像
#       （arm64 机器用 open-webui-offline-arm64.tar.gz, 导入后标签为 offline-arm64,
#         需 docker tag open-webui:offline-arm64 open-webui:offline 或改下面 image 字段）
# pull_policy: never = 绝不联网拉镜像, 镜像缺失时直接报错而不是去 Docker Hub 拉
services:
  open-webui:
    image: open-webui:offline-nkxz
    pull_policy: never
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080" # 宿主机端口:容器端口, 改左侧为内网要用的端口
    volumes:
      # bind mount: 数据直接落在宿主机 /root/data/open-webui 下, 方便备份和迁移
      - /root/data/open-webui:/app/backend/data # 数据持久化(数据库/上传文件/配置)
      # 后端环境变量(.env: SSO等): 把 .env 放到 docker-compose.offline.yaml 同目录,
      # 后端 env.py 启动时读取容器内 /app/.env; 注意 .env 必须先存在, 否则会被当成目录
      - ./.env:/app/.env
    environment:
      # === 模型服务(OpenAI 兼容 API) 和 Pipeline 服务, 分号分隔, 多个地址可一起写 ===
      # 地址用宿主机IP, 或同一 docker 网络内的服务名; 通常要带 /v1 路径
      - 'OPENAI_API_BASE_URLS=http://模型服务IP:8000/v1;http://pipeline服务IP:9099/api/v1'
      # 与上面地址一一对应的 API Key, 没有就留空字符串
      - 'OPENAI_API_KEYS=;'
      # 建议设置固定密钥, 保持各容器/升级前后一致
      - 'WEBUI_SECRET_KEY=<改成一段随机字符串>'
      # 不使用 RAG 知识库检索: 置为非空值(如 ollama/openai)可跳过启动时下载
      # sentence-transformers embedding 模型(内网离线环境务必设置, 否则会一直尝试联网下载)
      - 'RAG_EMBEDDING_ENGINE=ollama'
      # 重排序模型留空(默认), 不会触发下载
      - 'RAG_RERANKING_MODEL='
    extra_hosts:
      # 若模型/pipeline 服务和 open-webui 在同一台宿主机上, 可用 host.docker.internal 代替 IP
      - host.docker.internal:host-gateway

